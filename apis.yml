x-shutdown-note: >-
  Scaled back to near-zero from late 2018 after a cash crunch and a deposit-refund crisis affecting
  more than 10 million users; dissolved its international division in July 2018 and had stopped
  operating bike rentals by 2020. No formal liquidation date is published; the corporate entity was
  reported as a listed dishonest judgment debtor in China rather than wound up cleanly.
x-domain-status: offline
x-domain-note: >-
  ofo.com holds a live registration through Alibaba Cloud (registry expiry 2027-09-08), still
  resolves to 47.93.164.86 and still carries NetEase corporate MX records, but both port 80 and
  port 443 are closed at the origin, so no HTTP request completes and no /.well-known/ or spec path
  can be probed. The last Wayback capture of https://www.ofo.com/ is 2023-09-28. ofo.so is NOT Ofo
  any more — it was re-registered through Dynadot on 2025-04-21 and 302s to an arcade-game
  monetisation lander. Neither host is wired as a Website pointer.
