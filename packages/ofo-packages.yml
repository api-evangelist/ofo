summary: >-
  Ofo never operated a developer program and shipped no official client libraries in any language.
  The only package that wraps Ofo's endpoints is a third-party, unofficial Node client written
  against the private consumer mobile-app API; its source repository no longer exists and its last
  release predates the company's collapse. No `SDKs` pointer is wired into apis.yml, because
  `official: true` is not true of anything below.
